[project]
name = "claude-evernote-sync"
version = "0.1.0"
description = "Sync Claude Code CLI conversations to Evernote as daily rollup notes"
authors = [
    { name = "Bubba Brooks", email = "bubba@tiledb.com" }
]
requires-python = ">=3.13"
dependencies = [
    "evernote-plus>=1.28.1.dev2",
    "tomli>=2.0.0; python_version<'3.11'",
]

[project.scripts]
claude-evernote-sync = "claude_evernote_sync.main:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=claude_evernote_sync --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["src/claude_evernote_sync"]
omit = ["src/claude_evernote_sync/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["evernote.*", "thrift.*"]
ignore_missing_imports = true
